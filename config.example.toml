# url = "https://open.feishu.cn/open-apis/bot/v2/hook/xxxx"
# # 机器人安全设置里开了“签名校验”时填 secret，发送会自动加签
# secret = "your-signature-secret"
# tags = ["fun"]

# 订阅源数组：每个源一个 [[feeds]] 表。
# tags 是源自带的标签；fetch = true 表示正文直读（push 时经 Fetch 工具抓全文）。
[[feeds]]
url = "https://example.com/feed.xml"
tags = ["blog"]

[[feeds]]
url = "https://example.org/rss"
tags = ["rust"]
fetch = true
