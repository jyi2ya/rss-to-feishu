# rss-to-feishu 配置样例：复制为 config.toml 并填上真实值（config.toml 不入库）。
# 所有必填字段缺失会在启动时报错。

# sqlite 数据库文件
database_path = "db.sqlite3"

# 摘要用的 LLM（OpenAI 兼容接口）
[llm]
api_base = "http://llm.i.villv.tech/v1"
api_key = "your-api-key"
model = "brainllm"

# 网页正文抓取：DeepSeek Search API 的 Fetch 工具。
# base_url 可指向官方 API（https://api.deepseek.com，需要 api_key），
# 也可指向本地兼容实现。
[fetch]
base_url = "http://127.0.0.1:18620"
# 指向官方 API 时必填
# api_key = "sk-..."

# 订阅源抓取（可选，以下为缺省值）
[sync]
concurrency = 8
timeout_secs = 60
# 出口代理；缺省回退到 https_proxy / http_proxy 环境变量
# proxy = "http://127.0.0.1:10809"

# 飞书渠道数组：type = "tenant"（自建应用）或 "webhook"（群机器人）。
# tags 是标签白名单：非空时只推送带这些标签（任一命中）的条目；留空接收全部。
[[channels]]
name = "default"
type = "tenant"
# 环境变量名：里面放 tenant_access_token（由外部轮换，本工具不调登录接口）
token_env = "FEISHU_TENANT_TOKEN"
chat_id = "oc_xxx"
tags = []
# base_url = "https://open.feishu.cn"

